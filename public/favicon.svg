<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon. To regenerate the icon files, render this at 1024×1024 to a PNG
       (headless Chrome keeps the gradients and shadow), run `npx tauri icon <png> -o <tmp>` in
       crates/ui/frontend, and copy 32x32.png, 128x128.png, 128x128@2x.png, icon.icns,
       icon.ico and icon.png here. tray.png is separate: a monochrome template for the menu bar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3140"/>
      <stop offset="1" stop-color="#191b24"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1d6"/>
      <stop offset="0.65" stop-color="#f6e6c4"/>
      <stop offset="1" stop-color="#ebdcc4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.55" stop-color="#f05a2b"/>
      <stop offset="1" stop-color="#d63c1f"/>
    </radialGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4b2a"/>
      <stop offset="1" stop-color="#4a2a16"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c27a"/>
      <stop offset="1" stop-color="#a8853e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 tile with a 100px margin. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Hanging cord. -->
  <path d="M332 252 L512 168 L692 252" fill="none" stroke="#c9b48a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="166" r="13" fill="#c9b48a"/>

  <g filter="url(#shadow)">
    <!-- Brocade mounting. -->
    <rect x="322" y="262" width="380" height="540" fill="#a8977f"/>
    <!-- Paper. -->
    <rect x="352" y="300" width="320" height="464" fill="url(#paper)"/>

    <!-- Sun. -->
    <circle cx="512" cy="448" r="98" fill="url(#sun)"/>

    <!-- Clouds along the bottom. -->
    <g fill="#ffffff" opacity="0.75">
      <ellipse cx="420" cy="740" rx="78" ry="34"/>
      <ellipse cx="520" cy="732" rx="90" ry="40"/>
      <ellipse cx="616" cy="742" rx="72" ry="30"/>
    </g>

    <!-- A red-crowned crane flying left across the sun's edge. -->
    <g transform="translate(572 548) rotate(-12)">
      <!-- Far wing. -->
      <path d="M8 -4 C 20 -40, 46 -66, 78 -84 C 70 -54, 52 -26, 26 -2 Z" fill="#e4dccd"/>
      <!-- Legs trailing behind. -->
      <path d="M30 2 L 92 8" stroke="#3b3b3b" stroke-width="5" stroke-linecap="round"/>
      <!-- Body. -->
      <ellipse cx="10" cy="0" rx="34" ry="12" fill="#ffffff"/>
      <!-- Black tail feathers. -->
      <path d="M36 -6 L 58 -2 L 38 8 Z" fill="#2b2b2b"/>
      <!-- Neck and head, stretched forward. -->
      <path d="M-20 -2 L -64 -8" stroke="#2b2b2b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-66" cy="-9" r="7" fill="#ffffff"/>
      <circle cx="-66" cy="-13" r="3.5" fill="#d63c1f"/>
      <path d="M-72 -8 L -92 -4" stroke="#8a7a5a" stroke-width="4" stroke-linecap="round"/>
      <!-- Near wing, raised, with dark trailing tips. -->
      <path d="M-6 -6 C -2 -52, 24 -96, 62 -120 C 58 -76, 40 -36, 14 -4 Z" fill="#ffffff"/>
      <path d="M62 -120 C 58 -96, 52 -72, 42 -52 L 34 -60 C 44 -80, 54 -100, 62 -120 Z" fill="#2b2b2b"/>
    </g>

    <!-- Top rod. -->
    <rect x="300" y="244" width="424" height="34" rx="10" fill="url(#rod)"/>
    <!-- Bottom roller with end caps. -->
    <rect x="304" y="792" width="416" height="40" rx="12" fill="url(#rod)"/>
    <rect x="280" y="788" width="34" height="48" rx="10" fill="url(#cap)"/>
    <rect x="710" y="788" width="34" height="48" rx="10" fill="url(#cap)"/>
  </g>
</svg>
